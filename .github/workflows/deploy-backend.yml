name: Deploy Laravel Backend

on:
  push:
    branches: [ main, master, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Install composer dependencies
        run: composer install --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Create production .env
        run: |
          {
            echo "APP_NAME=HRDesk"
            echo "APP_ENV=production"
            echo "APP_KEY=${{ secrets.APP_KEY }}"
            echo "APP_DEBUG=true"
            echo "APP_URL=https://hrdesk.live/hrdesk_new/service"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=132.148.151.167"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=hrdesk1_eeipl"
            echo "DB_USERNAME=hrdesk1_user1"
            echo "DB_PASSWORD=V!sh@12705"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "LOG_CHANNEL=single"
            echo "CACHE_DRIVER=file"
            echo "SESSION_DRIVER=file"
            echo "QUEUE_DRIVER=sync"
          } > .env

      - name: Configure SSH for legacy algorithms
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << 'EOF'
          Host *
            HostKeyAlgorithms +ssh-rsa,ssh-dss
            PubkeyAcceptedAlgorithms +ssh-rsa,ssh-dss
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy files to server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlvz --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          TARGET: "/home/hrdesk1/public_html/hrdesk_new/service"
